[project]
name = "lang-ai-agent"
version = "0.1.1"
description = "LangGraph-based production agent backend with a human-approval gate for effectful tools (Ops Copilot demo)"
authors = [
    { name = "Trapa-Eureka", email = "son199@hanmail.net" }
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["langgraph", "langchain", "agent", "human-in-the-loop", "approval", "fastapi", "sse", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.4.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.0",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sse-starlette>=3.4.10",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
lang-ai-agent = "lang_ai_agent.cli:main"

[project.urls]
Homepage = "https://github.com/Trapa-Eureka/lang-ai-agent"
Repository = "https://github.com/Trapa-Eureka/lang-ai-agent"
Issues = "https://github.com/Trapa-Eureka/lang-ai-agent/issues"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff format also rewrites fenced ```python blocks inside Markdown; docs/*.md
# use compact pseudo-code for illustration, not real formatted source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["lang_ai_agent"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["tests/typecheck_fixtures"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# langgraph/langchain-core ship a package-level py.typed and are fully
# annotated in source, but pyright's stub-completeness heuristic still
# flags some of their submodules (e.g. langgraph.graph.message) as if a
# dedicated .pyi stub were missing. We trust their inline types rather than
# accumulate a `# type: ignore` on every import site across the codebase.
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=lang_ai_agent",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/lang_ai_agent"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", 'if __name__ == "__main__":']
